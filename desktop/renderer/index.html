<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Editor — Central de Serviços de Amargosa</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="extensions.css">
  <link rel="stylesheet" href="../templates/fonts.css">
</head>
<body>
  <header class="topbar">
    <div class="editor-brand"><span>A</span><div><strong>Construtor da Central</strong><small id="project-source">Projeto interno</small></div></div>
    <div class="save-state"><i></i><span id="save-state">Conteúdo carregado</span></div>
    <div class="top-actions">
      <button id="open-portal" class="secondary">Abrir portal</button><button id="reload-portal" class="secondary" hidden>Recarregar</button>
      <div class="devices"><button class="active" data-device="desktop">Desktop</button><button data-device="tablet">Tablet</button><button data-device="mobile">Celular</button></div>
      <button id="validate" class="secondary">Validar</button><button id="export" class="primary">Gerar portal</button>
    </div>
  </header>
  <div class="workspace">
    <aside class="left-panel schema-panel">
      <p class="panel-label">PÁGINA</p>
      <div class="page-tools"><select id="page-select" aria-label="Página"></select><button id="add-page" title="Adicionar página">+</button></div>
      <div class="page-meta"><input id="page-name" placeholder="Nome da página"><input id="page-slug" placeholder="/endereco"></div>
      <div class="schema-title"><p class="panel-label">SEGMENTOS</p><button id="add-segment">+ Adicionar</button></div>
      <nav id="segment-nav" class="section-nav"></nav>
    </aside>
    <section class="canvas">
      <header><span>PRÉVIA DA PÁGINA</span><strong id="viewport-label">1440 × 900 · 100%</strong></header>
      <div class="preview-stage"><iframe id="preview" title="Prévia do portal"></iframe></div>
    </section>
    <aside class="right-panel component-panel">
      <header class="right-tabs"><button class="active" data-editor-mode="content">Conteúdo</button><button type="button" data-editor-mode="design">Design</button></header>
      <div id="segment-empty" class="empty-editor">Selecione um segmento para editar.</div>
      <div id="segment-editor" class="dynamic-editor hidden">
        <div data-editor-pane="content">
        <section class="segment-settings">
          <div class="form-heading inline"><div><small>SEGMENTO</small><h2 id="segment-heading">Segmento</h2></div><div class="mini-actions"><button id="segment-up">↑</button><button id="segment-down">↓</button><button id="delete-segment" class="danger">Excluir</button></div></div>
          <label>Nome do segmento<input id="segment-name"></label>
          <div class="two-fields"><label>Tipo<select id="segment-type"></select></label><label class="check compact-check"><input id="segment-enabled" type="checkbox"><span>Visível</span></label></div>
        </section>
        <section class="items-section">
          <div class="form-heading inline"><div><small>ITENS DO SEGMENTO</small><h2>Conteúdo</h2></div><div class="add-item"><select id="new-item-type"></select><button id="add-item">+ Item</button></div></div>
          <div id="item-list" class="item-list"></div>
          <div id="item-editor" class="item-editor hidden"></div>
        </section>
        </div>
        <div data-editor-pane="design" class="hidden design-pane">
          <div class="form-heading"><small>MODELOS DO SEGMENTO</small><h2 id="variant-heading">Escolha um modelo</h2></div>
          <div id="variant-picker" class="variant-picker"></div>
          <section class="design-controls"><div class="form-heading"><small>AJUSTES FINOS</small><h2>Aparência</h2></div><div class="style-grid">
            <label>Fundo<input id="style-background" type="color"></label><label>Texto<input id="style-color" type="color"></label><label>Destaque<input id="style-accent" type="color"></label>
            <label>Largura<select id="style-width"><option value="narrow">Estreita</option><option value="contained">Contida</option><option value="wide">Ampla</option></select></label>
            <label>Espaçamento<select id="style-spacing"><option value="compact">Compacto</option><option value="comfortable">Confortável</option><option value="airy">Arejado</option></select></label>
            <label>Cantos<select id="style-radius"><option value="square">Retos</option><option value="soft">Discretos</option><option value="round">Arredondados</option></select></label>
          </div><div class="image-field"><label>Imagem de fundo<input id="background-upload" type="file" accept="image/*"></label><button id="remove-background" type="button">Remover</button><small id="background-status"></small></div></section>
        </div>
      </div>
      <div class="right-footer"><button id="save" class="primary">Salvar alterações</button></div>
    </aside>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="validation-dialog"><div class="dialog-icon">✓</div><h2 id="dialog-title">Tudo certo</h2><div id="dialog-content"></div><button id="close-dialog">Fechar</button></dialog>
  <script src="renderer.js"></script>
</body>
</html>
