services:
  portal:
    image: ${IMAGE_NAME:-ghcr.io/gustavodevgti/central-de-servicos-amargosa:latest}
    pull_policy: always
    restart: unless-stopped
    init: true
    ports:
      - "${PORTAL_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
