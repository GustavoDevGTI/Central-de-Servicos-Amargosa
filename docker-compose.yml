services:
  portal:
    image: ${IMAGE_NAME:-ghcr.io/gustavodevgti/central-de-servicos-amargosa:latest}
    pull_policy: always
    restart: unless-stopped
    init: true
    depends_on:
      catalog-db:
        condition: service_healthy
    ports:
      - "${PORTAL_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      VINEXT_TRUSTED_HOSTS: ${VINEXT_TRUSTED_HOSTS:?Configure VINEXT_TRUSTED_HOSTS com o host publico do portal, sem protocolo}
      NEXT_PUBLIC_SITE_URL: ${BETTER_AUTH_URL:?Configure BETTER_AUTH_URL com a origem HTTPS do portal}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Configure BETTER_AUTH_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Configure BETTER_AUTH_SECRET}
      DATABASE_URL: postgresql://central:${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}@catalog-db:5432/central_catalog
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-GTI}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      AI_PROVIDER: ${AI_PROVIDER:-deepseek}
      AI_MODEL: ${AI_MODEL:-deepseek-flash}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-800}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-25000}
      AI_RATE_LIMIT_MESSAGES: ${AI_RATE_LIMIT_MESSAGES:-10}
      AI_DAILY_SESSION_LIMIT: ${AI_DAILY_SESSION_LIMIT:-30}
      AI_MONTHLY_BUDGET_BRL: ${AI_MONTHLY_BUDGET_BRL:-100}
      AI_USD_TO_BRL: ${AI_USD_TO_BRL:-6}
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  catalog-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: central
      POSTGRES_DB: central_catalog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}
    volumes:
      - catalog-data:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U central -d central_catalog"]
      interval: 10s
      timeout: 5s
      retries: 5
    # O banco só é acessível pela rede interna da stack, sem publicar uma porta.

volumes:
  catalog-data:
