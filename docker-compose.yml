services:
  portal:
    image: ${IMAGE_NAME:-ghcr.io/gustavodevgti/central-de-servicos-amargosa:latest}
    pull_policy: always
    restart: unless-stopped
    init: true
    ports:
      - "${PORTAL_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      AI_PROVIDER: ${AI_PROVIDER:-deepseek}
      AI_MODEL: ${AI_MODEL:-deepseek-flash}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-800}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-25000}
      AI_RATE_LIMIT_MESSAGES: ${AI_RATE_LIMIT_MESSAGES:-10}
      AI_DAILY_SESSION_LIMIT: ${AI_DAILY_SESSION_LIMIT:-30}
      AI_MONTHLY_BUDGET_BRL: ${AI_MONTHLY_BUDGET_BRL:-100}
      AI_USD_TO_BRL: ${AI_USD_TO_BRL:-6}
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
